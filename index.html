<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İki Sayının Toplamı | JS Eğitim Uygulamaları - 1</title>
</head>
<body>
    <!-- Birinci Sayı Girişi  -->
    <input type="number" placeholder="Lütfen 1. Sayıyı Giriniz : " id="sayi1">
    <br><br>

    <!-- İkinci Sayı Girişi -->
    <input type="number" placeholder="Lütfen 2. Sayıyı Giriniz : " id="sayi2">
    <br><br>

    <!-- İşlem Seçim Menüsü  -->
    <label for="dortislem">Yapmak istediğiniz işlemi seçiniz : </label>
    <select name="dortislem" id="dortislem">
        <option value="seciniz">Seçiminizi Yapınız.</option> 
        <option value="toplama">Toplama</option>
        <option value="cikarma">Çıkarma</option>
        <option value="carpma">Çarpma</option>
        <option value="bolme">Bölme</option>
    </select>
    <br><br>

    <!-- Girilen Sayıların Javascript ile işlenerek, işlemin yapılması -->
    <button id="islemYapBtn">
        İşlemi Yap
    </button>
    <br><br><br>
    <!-- Burada Sonuç Kısmı Olacak -->
    <span id="sonuc">Sonuç : </span>

    <!-- Harici JavaScript Dosyasının Tanımlanması -->
    <script src="js-dort-islem.js" defer></script>
</body>
</html>
